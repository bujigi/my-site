<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이름 연상 이미지</title>
<style>
  /* 화면 전체 기본 스타일 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
    box-sizing: border-box;
    font-family: "맑은 고딕", sans-serif;
    background-color: #f2f2f2;
    word-break: keep-all; /* 한글이 단어 중간에서 줄바꿈되지 않게 */
  }

  /* 이름 입력란과 이미지 란을 각각 흰 카드로 나눕니다. */
  .panel {
    width: 100%;
    max-width: 960px;
    padding: 24px;
    box-sizing: border-box;
    border-radius: 16px;
    background-color: white;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .panel + .panel {
    margin-top: 16px;
  }

  h1 {
    margin: 0 0 8px;
    color: #333;
    text-align: center;
  }

  #guide {
    margin: 0 0 20px;
    color: #777;
    text-align: center;
  }

  /* 이름 입력 영역 */
  #searchForm {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  #nameInput {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
  }
  #nameInput:focus {
    border-color: #3498db;
  }

  #searchButton {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
  }
  #searchButton:hover {
    background-color: #555;
  }
  #searchButton:disabled {
    background-color: #aaa;
    cursor: default;
  }

  /* 진행 상황·결과 안내 문구 */
  #status {
    margin: 0 0 16px;
    min-height: 24px;
    font-size: 18px;
    color: #555;
    text-align: center;
  }

  /* 이미지들을 바둑판 모양으로 배치 */
  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  #gallery a {
    display: block;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background-color: #ddd;
  }

  #gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 정사각형 칸에 맞게 잘라서 채움 */
    display: block;
    transition: transform 0.2s ease;
  }
  #gallery a:hover img {
    transform: scale(1.05);
  }

  #credit {
    margin: 20px 0 0;
    font-size: 13px;
    color: #999;
    text-align: center;
  }

  /* 폰처럼 좁은 화면에서는 여백과 글자 크기를 줄입니다. */
  @media (max-width: 480px) {
    body {
      padding: 16px;
    }
    .panel {
      padding: 16px;
      border-radius: 12px;
    }
    h1 {
      font-size: 24px;
    }
    #guide {
      font-size: 14px;
      text-align: center;
    }
    #nameInput {
      font-size: 16px; /* 16px 미만이면 아이폰이 입력할 때 화면을 확대해버림 */
    }
    #searchButton {
      padding: 12px 16px;
    }
    #status {
      font-size: 16px;
    }
    #gallery {
      gap: 8px;
    }
    #gallery a {
      border-radius: 8px;
    }
  }
</style>
</head>
<body>

  <!-- 1. 이름 입력란 -->
  <section class="panel">
    <h1>이름 연상 이미지</h1>
    <p id="guide">이름을 입력하면 그 이름에서 떠오르는 이미지를 보여드려요.</p>

    <form id="searchForm">
      <input id="nameInput" type="text" placeholder="예: 이순신, 고양이, 서울" autocomplete="off" />
      <button id="searchButton" type="submit">보기</button>
    </form>
  </section>

  <!-- 2. 이미지 보여주는 란 -->
  <section class="panel">
    <div id="status">위에 이름을 입력하면 여기에 이미지가 나타나요.</div>
    <div id="gallery"></div>
    <p id="credit">이미지 출처: 위키미디어 공용(Wikimedia Commons) · 이미지를 누르면 원본 페이지가 열립니다.</p>
  </section>

  <script>
    // 한 번에 보여줄 이미지 개수
    const IMAGE_COUNT = 12;

    // 화면에 있는 요소들을 미리 찾아둡니다.
    const searchForm = document.getElementById('searchForm');
    const nameInput = document.getElementById('nameInput');
    const searchButton = document.getElementById('searchButton');
    const statusElement = document.getElementById('status');
    const galleryElement = document.getElementById('gallery');

    // 위키미디어 공용에서 이름으로 이미지를 검색해 [{ thumb, link, title }] 목록을 돌려주는 함수
    async function searchImages(name) {
      const params = new URLSearchParams({
        action: 'query',
        format: 'json',
        origin: '*',                           // 다른 사이트에서 호출할 수 있게 해주는 옵션
        generator: 'search',
        gsrsearch: name + ' filetype:bitmap',  // 사진·그림 파일만 검색
        gsrnamespace: '6',                     // 6번 = 파일 문서
        gsrlimit: String(IMAGE_COUNT),
        prop: 'imageinfo',
        iiprop: 'url',
        iiurlwidth: '400'                      // 400px 크기의 썸네일 주소를 받음
      });

      const response = await fetch('https://commons.wikimedia.org/w/api.php?' + params);
      if (!response.ok) {
        throw new Error('검색 요청 실패: ' + response.status);
      }
      const data = await response.json();

      // 검색 결과가 없으면 query 자체가 없습니다.
      if (!data.query) {
        return [];
      }

      // 결과는 객체 형태라서 배열로 바꾸고, 검색 순위(index) 순서대로 정렬합니다.
      return Object.values(data.query.pages)
        .sort(function (a, b) { return a.index - b.index; })
        .filter(function (page) { return page.imageinfo; })
        .map(function (page) {
          return {
            thumb: page.imageinfo[0].thumburl,
            link: page.imageinfo[0].descriptionurl,
            title: page.title.replace(/^File:/, '')
          };
        });
    }

    // 검색 결과가 없을 때 쓰는 대체 이미지 목록 (같은 이름이면 항상 같은 이미지가 나옴)
    function makeFallbackImages(name) {
      const images = [];
      for (let i = 0; i < IMAGE_COUNT; i++) {
        const url = 'https://picsum.photos/seed/' + encodeURIComponent(name + '-' + i) + '/400/400';
        images.push({ thumb: url, link: url, title: name + ' 연상 이미지 ' + (i + 1) });
      }
      return images;
    }

    // 이미지 목록을 화면에 그리는 함수
    function renderGallery(images) {
      galleryElement.innerHTML = '';
      images.forEach(function (image) {
        const link = document.createElement('a');
        link.href = image.link;
        link.target = '_blank';
        link.rel = 'noopener';
        link.title = image.title;

        const img = document.createElement('img');
        img.src = image.thumb;
        img.alt = image.title;
        img.loading = 'lazy';

        link.appendChild(img);
        galleryElement.appendChild(link);
      });
    }

    // 폼을 제출했을 때(보기 버튼 또는 Enter) 실행되는 함수
    async function handleSubmit(event) {
      event.preventDefault(); // 페이지가 새로고침되지 않게 막습니다.

      const name = nameInput.value.trim();
      if (name === '') {
        statusElement.textContent = '이름을 입력해주세요.';
        nameInput.focus();
        return;
      }

      searchButton.disabled = true;
      statusElement.textContent = '"' + name + '"에서 떠오르는 이미지를 찾는 중...';
      galleryElement.innerHTML = '';

      try {
        let images = await searchImages(name);
        if (images.length > 0) {
          statusElement.textContent = '"' + name + '" 하면 떠오르는 이미지';
        } else {
          // 딱 맞는 이미지가 없으면 이름으로 정해지는 랜덤 이미지를 대신 보여줍니다.
          images = makeFallbackImages(name);
          statusElement.textContent = '"' + name + '"에 딱 맞는 사진이 없어서, 이름이 골라준 이미지를 보여드려요';
        }
        renderGallery(images);
      } catch (error) {
        statusElement.textContent = '이미지를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
      } finally {
        searchButton.disabled = false;
      }
    }

    searchForm.addEventListener('submit', handleSubmit);
    nameInput.focus();
  </script>

</body>
</html>
